<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101827" />
    <meta name="description" content="Forestbound Runner — leap, collect and complete a new objective every run." />
    <title>Forestbound Runner</title>
    <style>
      @font-face { font-family: "Pixel Operator"; src: url("./assets/source/brackeys/brackeys_platformer_assets/fonts/PixelOperator8.ttf") format("truetype"); font-display: swap; }
      :root { color-scheme: dark; font-family: "Trebuchet MS", system-ui, sans-serif; background: #101827; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #101827; overflow: hidden; }
      body { display: grid; place-items: center; }
      #game-shell { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #101827; }
      #game { width: 100%; height: 100%; }
      #loading { position: absolute; inset: 0; display: grid; place-items: center; background: #101827; z-index: 10; transition: opacity .35s ease; }
      #loading.is-ready { opacity: 0; pointer-events: none; }
      .loading-card { width: min(82vw, 420px); text-align: center; color: #fff6cf; }
      .loading-card h1 { margin: 0 0 10px; letter-spacing: .12em; font-size: clamp(24px, 5vw, 42px); }
      .loading-card p { margin: 0 0 22px; color: #a9bfd1; }
      .loading-track { height: 12px; border: 2px solid #e1b85a; border-radius: 999px; padding: 2px; background: #1a2837; }
      #loading-bar { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #e1b85a, #f6df91); transition: width .18s ease; }
      #loading-status { margin-top: 12px; font-size: 12px; color: #7f9aac; letter-spacing: .08em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main id="game-shell">
      <div id="game" aria-label="Forestbound Runner game"></div>
      <div id="loading" role="status" aria-live="polite">
        <div class="loading-card">
          <h1>FORESTBOUND</h1>
          <p>A new path. A new objective. One more run.</p>
          <div class="loading-track"><div id="loading-bar"></div></div>
          <div id="loading-status">Preparing the forest</div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
